name: eco_employee
description: Eco Sor Employee app (field sales, field support and every staff member).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  eco_core:
    path: ../eco_core
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  geolocator: ^14.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# App icon: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

# Splash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash.png
